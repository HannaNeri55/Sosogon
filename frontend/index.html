<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/favicon.ico" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&family=Inter:wght@400;500;600;700&display=swap"
    rel="stylesheet" />
  <title>Sorsogon - Tourism Information System</title>
  <meta name="description"
    content="Explore Sorsogon's destinations, places to stay, food and local shops, see upcoming events, and plan your trip with the Tourism Office's itinerary planner." />
  <!-- Link previews (Facebook, Messenger, etc.). Crawlers don't run JavaScript, so every page shares
       this preview. VITE_SITE_URL is the site's public address; previews need an absolute image URL. -->
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="Sorsogon Tourism" />
  <meta property="og:title" content="Sorsogon - Tourism Information System" />
  <meta property="og:description"
    content="Explore Sorsogon's destinations, places to stay, food and local shops, see upcoming events, and plan your trip." />
  <meta property="og:image" content="%VITE_SITE_URL%/images/destinations-hero.jpg" />
  <meta name="twitter:card" content="summary_large_image" />
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>

</html>
